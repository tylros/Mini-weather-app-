<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="./boxicons/boxicons.min.css">
 <title>Mini Weather App</title>
</head>
<body>
 <div class="container">
  <div class="left_info">
   <div class="pic_gradient">
    <div class="today_info">
     <h2 id="day">Sunday</h2>
     <span id="date">8 September 2024</span>
     <div>
      <i class="bx bx-current-location"></i> 
      <span id="location">Harare, ZW</span> 
     </div>
    </div>
    <div class="today_weather">
     <i id="weather-icon" class="bx bx-sun"></i>
     <h1 id="temperature" class="weather_temp">25°C</h1>
     <h3 id="weather-condition">Sunny</h3>
    </div>
   </div>
  </div>
  <div class="right_info">
   <div class="day_info">
    <div>
     <span class="title">PRECIPITATION</span>
     <span id="precipitation" class="value">5 %</span>
    </div>
    <div>
     <span class="title">HUMIDITY</span>
     <span id="humidity" class="value">20 %</span>
    </div>
    <div>
     <span class="title">WIND SPEED</span>
     <span id="wind-speed" class="value">5 km/h</span>
    </div>
   </div>

   <ul class="days_list" id="forecast">
    <!-- Forecast data will be dynamically added here -->
   </ul>
   <div class="btn_container">
    <input type="text" id="location-input" placeholder="Enter location">
    <button id="search-button" class="loc_button">Search Location</button>
   </div>
  </div>
 </div>
 <footer>
  <p>Developed by <a href="">Ashie_fx</a></p>
 </footer>

 <script src="script.js"></script>
</body>
</html>
